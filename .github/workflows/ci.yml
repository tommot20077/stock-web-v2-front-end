name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vue-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vue-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # D-15:前端單獨的 PR 也要有真後端 browser E2E 證據(仿後端 CI 的 Browser E2E job,方向相反)。
  # 後端 repo tommot20077/stock-web-v2 為 public(2026-11-07 以 GitHub REST 確認 "private": false),
  # 跨 repo checkout 用預設 github.token 即可,無 PAT / deploy key、不需 Yuan 人工步驟。
  # 若後端改為 private:需在前端 repo 加唯讀 secret(fine-grained PAT 或 deploy key),
  # 並在「Checkout backend」step 帶 token: / ssh-key:;本 job 目前刻意不讀任何 secrets。
  # 本 job checkout 到 frontend/ 與 backend/ 子目錄,不沿用 frontend job 的 defaults.run。
  browser-e2e:
    name: Browser E2E (real backend)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout frontend (self)
        uses: actions/checkout@v4
        with:
          path: frontend

      # 跨 repo 協作:後端對應變更可能還在同名 feature 分支(尚未 merge 進 develop),
      # 故 checkout「與前端 head 同名的後端分支」,不存在才 fallback develop。
      - name: Resolve backend ref (match frontend branch, else develop)
        id: be_ref
        run: |
          CANDIDATE="${{ github.head_ref || github.ref_name }}"
          BE_REPO="https://github.com/tommot20077/stock-web-v2.git"
          if git ls-remote --exit-code --heads "$BE_REPO" "$CANDIDATE" >/dev/null 2>&1; then
            echo "ref=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "後端使用對應分支:$CANDIDATE"
          else
            echo "ref=develop" >> "$GITHUB_OUTPUT"
            echo "後端無對應分支 $CANDIDATE,fallback develop"
          fi

      - name: Checkout backend (stock-web-v2)
        uses: actions/checkout@v4
        with:
          repository: tommot20077/stock-web-v2
          ref: ${{ steps.be_ref.outputs.ref }}
          path: backend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      - name: Cache Maven wrapper distribution
        id: mvnw-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven distribution (retry on rate limit)
        if: steps.mvnw-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/vue-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/vue-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/vue-app
        run: npx playwright install --with-deps chromium

      # run-e2e.sh:4173 / 8080 前置檢查 → compose up infra → 後端 mvnw package + java -jar
      # (e2e-browser,port 8080)→ 等 /actuator/health UP → Playwright(無參數 = 全部 tag,含 @extended)。
      # Playwright webServer 以 VITE_API_PROXY_TARGET=http://localhost:8080 跑 vite preview(D-21)。
      - name: Run Browser E2E (all tags)
        working-directory: frontend/vue-app
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
        run: bash e2e/run-e2e.sh

      - name: Upload Browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: frontend/vue-app/e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore
